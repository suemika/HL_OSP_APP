ServerScriptComp1=// (\u670D\u52A1\u7AEF\u811A\u672C\u7EC4\u4EF6)ServerScriptComp1.callFunction\nvar where \= "1\=1 ";\nwhere +\= " and BILL_TYPE \= '100601' ";\nvar plan \= PO.getValue("plan","");\nvar userId \= PO.getEnv("UserName","");\nif(plan){\n    where +\= " and (BILL_ID like '%'||" + "@{plan}@" + "||'%' OR PLAN_DESC like '%'||" + "@{plan}@" + "||'%') ";\n}\n\nvar orgCode \= PO.getValue("orgCode", "");\n\nvar isSuperAdmin \= PO.getValue("isSuperAdmin", "");\nif(\!isSuperAdmin){\n        where +\= " and exists( "\n+"        select 1 from ( "\n+"                select ORG_ID,ORG_PATH from SYS_ORG org "\n+"                where exists ( "\n+"                        select 1 from ( "\n+"                        select SYS_ORG.ORG_PATH, BSUSSJ.* "\n+"                        from SYS_ORG, BSUSSJ "\n+"                        where "\n+"                            SYS_ORG.ORG_ID \= BSUSSJ.F_SJBH "\n+"                            and BSUSSJ.F_ZGBH \= '"+userId+"' "\n+"                            and BSUSSJ.F_QXBH \= 'SYS_ORG' "\n+"                            and BSUSSJ.F_G2 \= '1' "\n+"                        union "\n+"                        select SYS_ORG.ORG_PATH, BSUSSJ.* "\n+"                        from SYS_ORG, BSUSSJ "\n+"                        where "\n+"                            SYS_ORG.ORG_ID \= BSUSSJ.F_SJBH "\n+"                            and BSUSSJ.F_QXBH \= 'SYS_ORG' "\n+"                            and BSUSSJ.F_G2 \= '1' "\n+"                            and exists (select 1 from bsuserrole b where BSUSSJ.F_ZGBH \= b.F_ROLECODE and b.F_ZGBH \= '"+userId+"' ) "\n+"                        ) tmp where org.ORG_PATH like CONCAT(tmp.ORG_PATH, '%') "\n+"                ) "\n+"        ) gr where gr.ORG_ID \=  EAM_EQ_SPECIAL_PLAN_HEAD.ORG_CODE ";\n    where +\= " )";\n}\n\nif(orgCode \!\= "" && orgCode \!\= null){\n    where +\= " and ( (select ORG_PATH from SYS_ORG where ORG_ID \= EAM_EQ_SPECIAL_PLAN_HEAD.USE_ORG_CODE) like CONCAT((select ORG_PATH from SYS_ORG where ORG_ID \= '"+orgCode+"' ), '%') or (select ORG_PATH from SYS_ORG where ORG_ID \= EAM_EQ_SPECIAL_PLAN_HEAD.USE_DEPT_CODE) like CONCAT((select ORG_PATH from SYS_ORG where ORG_ID \= '"+orgCode+"' ), '%') ) ";\n}\n\nPO.setParam("ENUMWHERE", where);\nPO.setParam("EAM_EQ_SPECIAL_PLAN_HEAD_OrderBy"," BILL_ID DESC");
ServerScriptComp2=// (\u670D\u52A1\u7AEF\u811A\u672C\u7EC4\u4EF6)ServerScriptComp2.callFunction\nvar isSuperAdmin \= PO.getValue("isSuperAdmin","");\nvar BILL_ID \= PO.getValue("BILL_ID","");\nvar STATUS \= PO.getValue("STATUS","");\nvar orgCode \= PO.getValue("orgCode","");\nvar userId \= PO.getValue("userId","");\nvar where \= " 1\=1 ";\nif(\!isSuperAdmin){\n    where +\= " and (exists(select 1 from VIEW_BSUSSJ_ORG org where org.f_g2\='1' and org.f_zgbh\='"+userId+"'  and (EAM_EQ_INV_PLAN_HEAD.ORG_CODE \= org.ORG_ID))";\n    where +\= " or CREATE_BY \= '"+userId+"')";\n}\nif (BILL_ID) {\n    where +\= " and (BILL_ID like concat('%"+BILL_ID+"','%') or IN_PLAN_DESC like concat('%"+BILL_ID+"','%'))";\n}\nif (STATUS) {\n    where +\= " and STATUS \= '" + STATUS + "'";\n}\nif (orgCode) {\n    where +\= " and exists (select 1  from sys_org org2 where (org2.ORG_PATH like concat((select ORG_PATH  from sys_org outOrg where ORG_ID \= '"+orgCode+"' limit 0,1), '.%') or ORG_PATH \= (select ORG_PATH  from sys_org outOrg where ORG_ID \= '"+orgCode+"' limit 0,1)) and (org2.ORG_ID \=  EAM_EQ_INV_PLAN_HEAD.USE_ORG_CODE or org2.ORG_ID \=  EAM_EQ_INV_PLAN_HEAD.ORG_CODE))";\n}\n\nPO.setParam("ENUMWHERE", where);\nPO.setParam("EAM_EQ_INV_PLAN_HEAD_OrderBy"," BILL_ID DESC");
