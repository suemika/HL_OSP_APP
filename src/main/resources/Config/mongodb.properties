#mongodb是否开启,false 关闭；true 开启；不配置默认为开启
cache.mongodb.enable=false
#mongodb连接配置
cache.mongodb.url=
#mongodb数据库名称
cache.mongodb.dbName=
#mongodb集合名称
cache.mongodb.colletctionName=
#读取配置 primary primaryPreferred secondary secondaryPreferred nearest
cache.mongodb.readPreference=primary
#身份验证设置
cache.mongodb.auth=true
#用户名
cache.mongodb.userName=
#密码
cache.mongodb.password=
#用户定义时使用的数据库名称
cache.mongodb.sourceName=
#连接池配置
#线程池允许的最大连接数,默认是100，设置为2000
cache.mongodb.maxSize=200
#线程池空闲时保持的最小连接数, 默认是0.设置为100
cache.mongodb.minSize=5
#线程池等待队列的大小, 默认是500，设置为10000
cache.mongodb.maxWaitQueueSize=6000
#等待连接变为可用的最长时间.默认为3分钟，0为不等待，负值为无限期等待
cache.mongodb.maxWaitTimeMS=180000
#线程池中连接的最长生存时间. 0表示没有限制
cache.mondodb.maxConnectionLifeTimeMS=0
#线程池中连接的最大空闲时间,0无限制，设置为6秒,这个不能设置太大
cache.mongodb.maxConnectionIdleTimeMS=6000
#作用不明，默认为0
cache.mongodb.maintenanceInitialDelayMS=0
#作用不明，默认为一分钟
cache.mongodb.maintenanceFrequencyMS=60000
#mongodb socket设置
#连接超时设置,设置为30秒
cache.mongodb.socketConnectTimeoutMS=30000
#读取超时时间，设置为3分钟
cache.mongodb.socketReadTimeoutMS=180000
