<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="" />
        <title>osp平台下载</title>
        <script type="text/javascript" src="./react/application.js?<%=new Date().getTime()%>"></script>
        <script src="./react/flexible.min.js" type="text/javascript"></script>
        <style>
            html, body {
                height: 100%;
            }
            body {
                font-family: Microsoft YaHei, PingFang SC, Helvetica Neue, Helvetica, Hiragino Sans GB, Arial, sans-serif !important;
            }

            * {
                padding: 0;
                margin: 0;
            }
            .app-download {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100%;
                padding-top: 3.65rem;
                box-sizing: border-box;
            }
            .app-download .icon {
                width: 2.45rem;
            }
            .app-download h3 {
                margin-top: 1.467rem;
                font-size: 24px;
                color: rgba(0, 0, 0, 0.85);
            }
            .app-download h4 {
                margin-top: 0.3rem;
                font-size: 16px;
                color: rgba(0, 0, 0, 0.65);
            }
            .app-download p {
                margin-top: 0.7rem;
                font-size: 12px;
                line-height: 0.48rem;
                color: rgba(0, 0, 0, 0.45);
            }
            .app-download p span {
                display: inline-block;
                width: 100%;
                text-align: center;
            }
            .app-download button {
                margin-top: 0.7rem;
                border: none;
                background-color: #0081cc;
                color: #ffffff;
                width: 6.56rem;
                height: 1.07rem;
                border-radius: 6px;
                font-size: 0.427rem;
            }
            .app-download button a {
                text-decoration: none;
                color: #ffffff;
                display: flex;
                width: 100%;
                height: 100%;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <div class="app-download">
            <img class="icon" src="" />
            <h3>OSP平台客户端</h3>
            <h4>立即下载，享受轻松高效的办公体验</h4>
            <p>
                <span>开发者：普联软件股份有限公司</span>
                <span>版本号：v1.0.0</span>
            </p>
            <button>
                <a>下载OSP平台客户端</a>
            </button>
        </div>
        <script src="./js/orgchart/js/jquery-3.1.0.min.js" type="text/javascript"></script>
        <script>
            (function() {
                var appDLMenu = {};
                for (var i = 0; i < window.reactEnv.LOGIN.menu.length; i++) {
                    if (window.reactEnv.LOGIN.menu[i].type === 'appdownload') {
                        appDLMenu = window.reactEnv.LOGIN.menu[i];
                    }
                }
                $(".icon").attr('src', appDLMenu.downloadConfig.icon);

                /*  
             * 智能机浏览器版本信息:  
             *  
             */  
            var browser = {  
                versions: function() {  
                    var u = navigator.userAgent, app = navigator.appVersion;  
                    return {//移动终端浏览器版本信息  
                        trident: u.indexOf('Trident') > -1, //IE内核  
                        presto: u.indexOf('Presto') > -1, //opera内核  
                        webKit: u.indexOf('AppleWebKit') > -1, //苹果、谷歌内核  
                        gecko: u.indexOf('Gecko') > -1 && u.indexOf('KHTML') == -1, //火狐内核  
                        mobile: !!u.match(/AppleWebKit.*Mobile.*/) || !!u.match(/AppleWebKit/), //是否为移动终端  
                        ios: !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/), //ios终端  
                        android: u.indexOf('Android') > -1 || u.indexOf('Linux') > -1, //android终端或者uc浏览器  
                        iPhone: u.indexOf('iPhone') > -1 || u.indexOf('Mac') > -1, //是否为iPhone或者QQHD浏览器  
                        iPad: u.indexOf('iPad') > -1, //是否iPad  
                        webApp: u.indexOf('Safari') == -1 //是否web应该程序，没有头部与底部  
                    };  
                }(),  
                language: (navigator.browserLanguage || navigator.language).toLowerCase()  
            }  

            if (browser.versions.ios || browser.versions.iPhone || browser.versions.iPad) {  
                $('.app-download a').on('click', function() {
                    alert('暂不支持IOS端下载')
                })
            } else if (browser.versions.android) {  
                $('.app-download a').attr('href', appDLMenu.downloadConfig.Android.downloadUrl);
                $('.app-download a').attr('download', appDLMenu.downloadConfig.Android.downloadName);
            } 
            })()    
        </script>
    </body>
</html>
