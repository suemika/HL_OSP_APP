<head>

<title>img2base64</title> 
<style>

<script> 

	var value64 ;
	window.onload = function(){ 
		var input = document.getElementById("demo_input"); 
		var result= document.getElementById("result"); 
	   
		if ( typeof(FileReader) === 'undefined' ){ 
				result.innerHTML = "抱歉，你的浏览器不支持 FileReader，请使用现代浏览器操作！"; 
				input.setAttribute( 'disabled','disabled' ); 
		} else { 
				input.addEventListener( 'change',readFile,false );} 
	}
	
	function readFile(){ 
			var file = this.files[0]; 
			
			
			//判断下类型如果不是图片就返回 去掉就可以上传任意文件   
			if(!/image\/\w+/.test(file.type)){   
					alert("请确保文件为图像类型"); 
					return false; 
			} 
			var imagesize = file.size;
			
			/**
			if(imagesize>1024*1000){//1024 = 1k
				alert("文件太大，请限制在1M之内"); 
				return false;
			}
			**/
			
			var reader = new FileReader(); 
			reader.readAsDataURL(file); 
			reader.onload = function(e){
			
			
			//result.innerHTML = '<img src="'+this.result+'" alt=""/>'; 
			
			value64 = '<img id = "demoImage" src="'+this.result+'" alt=""/>';
			
		    } 
	} 
	
	function okcilck(){
	
	window.opener.setimageToedit(value64);
	window.close();
	}
</script> 
</head>  
<body onblur=""> 
<input type="file" value="" id="demo_input" /> 
</br>
<input type="button" value="确定" id="OKbutton" onclick="okcilck()"/> 
<input type="button" value="取消" id="CancleButton" onclick="window.close();	"/>

</body>
